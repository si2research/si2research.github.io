<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc"><title id="title">Grover search: amplify the marked answer</title><desc id="desc">An illustrative set of sixteen cards leads to a simulated target probability of 96.13 percent for 0101.</desc><rect width="1000" height="350" rx="22" fill="#edf5f7"/><g font-family="Arial,sans-serif" fill="#102d46"><text x="36" y="46" font-size="25" font-weight="700">Sixteen possibilities. One marked answer.</text><text x="36" y="77" font-size="16">Four-qubit Grover example · three iterations · marked value 5</text><rect x="36" y="108" width="50" height="51" rx="8" fill="#ffffff" stroke="#bacdd8"/><text x="43" y="138" font-size="15" fill="#40566b">0000</text><rect x="94" y="108" width="50" height="51" rx="8" fill="#ffffff" stroke="#bacdd8"/><text x="101" y="138" font-size="15" fill="#40566b">0001</text><rect x="152" y="108" width="50" height="51" rx="8" fill="#ffffff" stroke="#bacdd8"/><text x="159" y="138" font-size="15" fill="#40566b">0010</text><rect x="210" y="108" width="50" height="51" rx="8" fill="#ffffff" stroke="#bacdd8"/><text x="217" y="138" font-size="15" fill="#40566b">0011</text><rect x="268" y="108" width="50" height="51" rx="8" fill="#ffffff" stroke="#bacdd8"/><text x="275" y="138" font-size="15" fill="#40566b">0100</text><rect x="326" y="108" width="50" height="51" rx="8" fill="#007e76" stroke="#bacdd8"/><text x="333" y="138" font-size="15" fill="white">0101</text><rect x="384" y="108" width="50" height="51" rx="8" fill="#ffffff" stroke="#bacdd8"/><text x="391" y="138" font-size="15" fill="#40566b">0110</text><rect x="442" y="108" width="50" height="51" rx="8" fill="#ffffff" stroke="#bacdd8"/><text x="449" y="138" font-size="15" fill="#40566b">0111</text><rect x="36" y="172" width="50" height="51" rx="8" fill="#ffffff" stroke="#bacdd8"/><text x="43" y="202" font-size="15" fill="#40566b">1000</text><rect x="94" y="172" width="50" height="51" rx="8" fill="#ffffff" stroke="#bacdd8"/><text x="101" y="202" font-size="15" fill="#40566b">1001</text><rect x="152" y="172" width="50" height="51" rx="8" fill="#ffffff" stroke="#bacdd8"/><text x="159" y="202" font-size="15" fill="#40566b">1010</text><rect x="210" y="172" width="50" height="51" rx="8" fill="#ffffff" stroke="#bacdd8"/><text x="217" y="202" font-size="15" fill="#40566b">1011</text><rect x="268" y="172" width="50" height="51" rx="8" fill="#ffffff" stroke="#bacdd8"/><text x="275" y="202" font-size="15" fill="#40566b">1100</text><rect x="326" y="172" width="50" height="51" rx="8" fill="#ffffff" stroke="#bacdd8"/><text x="333" y="202" font-size="15" fill="#40566b">1101</text><rect x="384" y="172" width="50" height="51" rx="8" fill="#ffffff" stroke="#bacdd8"/><text x="391" y="202" font-size="15" fill="#40566b">1110</text><rect x="442" y="172" width="50" height="51" rx="8" fill="#ffffff" stroke="#bacdd8"/><text x="449" y="202" font-size="15" fill="#40566b">1111</text><text x="580" y="140" font-size="54" font-weight="700" fill="#007e76">96.13%</text><text x="580" y="173" font-size="19">probability of target 0101</text><rect x="580" y="193" width="365" height="23" rx="6" fill="#cedde5"/><rect x="580" y="193" width="351" height="23" rx="6" fill="#007e76"/><text x="580" y="246" font-size="15">Other 15 states combined: 3.87%</text><text x="36" y="294" font-size="17" font-weight="700">The check: did the simulation amplify the intended state?</text><text x="36" y="322" font-size="15">One saved instance. Broader correctness and gate-error claims require additional tests.</text></g></svg>